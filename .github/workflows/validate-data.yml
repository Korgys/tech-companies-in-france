name: Validate data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CSV files
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import re
          import sys
          from datetime import date
          from pathlib import Path

          expected = [
              "name", "domain", "city", "website", "careers_url",
              "linkedin_url", "known_stack", "company_size", "notes",
              "last_verified", "sources",
          ]
          errors = []
          paths = sorted(Path("data").rglob("*.csv"))
          if not paths:
              errors.append("data/: aucun fichier CSV")

          for path in paths:
              try:
                  with path.open(encoding="utf-8-sig", newline="") as stream:
                      reader = csv.reader(stream, strict=True)
                      if next(reader, None) != expected:
                          errors.append(f"{path}: en-tête incorrect")
                          continue
                      for row in reader:
                          location = f"{path}:{reader.line_num}"
                          if len(row) != len(expected):
                              errors.append(f"{location}: {len(row)} colonnes au lieu de {len(expected)}")
                              continue
                          verified = row[expected.index("last_verified")]
                          if verified:
                              try:
                                  if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", verified):
                                      raise ValueError
                                  date.fromisoformat(verified)
                              except ValueError:
                                  errors.append(f"{location}: last_verified doit être une date YYYY-MM-DD valide")
              except (OSError, UnicodeError, csv.Error) as exc:
                  errors.append(f"{path}: CSV illisible : {exc}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"Validation réussie : {len(paths)} fichier(s) CSV.")
          PY
