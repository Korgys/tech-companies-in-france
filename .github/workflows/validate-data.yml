name: Validate data

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BOT_PUSH_TOKEN }}
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Validate CSV files
              shell: bash
              run: |
                  python - <<'PY'
                  import csv
                  import os
                  import re
                  import sys
                  import unicodedata
                  from datetime import date
                  from pathlib import Path

                  expected = [
                      "name", "domain", "city", "website", "careers_url",
                      "linkedin_url", "known_stack", "company_size", "notes",
                      "last_verified",
                  ]
                  allowed_domains = {
                      "adtech", "agency", "agtech", "ai", "banking",
                      "cybersecurity", "data", "deeptech", "digital",
                      "ecommerce", "edtech", "energy", "enterprise", "fintech",
                      "gaming", "healthtech", "industrial", "insurance",
                      "it-services", "public-sector", "robotics", "saas",
                      "software", "studio", "telecom", "transport",
                  }
                  errors = []
                  total = 0

                  multi_value_fields = {"domain", "known_stack"}

                  def sort_value(value):
                      normalized = unicodedata.normalize("NFKD", value.casefold())
                      return "".join(char for char in normalized if not unicodedata.combining(char))

                  def row_sort_key(row):
                      name = row[expected.index("name")]
                      city = row[expected.index("city")]
                      return (
                          sort_value(name), sort_value(city), name, city, tuple(row)
                      )

                  paths = sorted(Path("data").rglob("*.csv"))
                  if not paths:
                      errors.append("data/: aucun fichier CSV")

                  for path in paths:
                      try:
                          with path.open(encoding="utf-8-sig", newline="") as stream:
                              reader = csv.reader(stream, strict=True)
                              if next(reader, None) != expected:
                                  errors.append(f"{path}: en-tête incorrect")
                                  continue
                              previous_row = None
                              for row in reader:
                                  location = f"{path}:{reader.line_num}"
                                  if len(row) != len(expected):
                                      errors.append(f"{location}: {len(row)} colonnes au lieu de {len(expected)}")
                                      continue
                                  if any(value.strip() for value in row):
                                      total += 1
                                      name = row[expected.index("name")]
                                      city = row[expected.index("city")]
                                      if previous_row is not None and row_sort_key(row) < row_sort_key(previous_row):
                                          errors.append(
                                              f"{location}: ligne non triée ({name!r}, {city!r})"
                                          )
                                      previous_row = row
                                  for field, value in zip(expected, row):
                                      if value != value.strip():
                                          errors.append(f"{location}: {field} contient des espaces superflus")
                                      if field in multi_value_fields and value:
                                          if "," in value or ";" in value:
                                              errors.append(
                                                  f"{location}: {field} doit utiliser | comme séparateur"
                                              )
                                          values = value.split("|")
                                          if any(not item or item != item.strip() for item in values):
                                              errors.append(
                                                  f"{location}: {field} contient un séparateur ou des espaces invalides"
                                              )
                                          if len(values) != len(set(values)):
                                              errors.append(f"{location}: {field} contient une valeur dupliquée")
                                  domain = row[expected.index("domain")]
                                  domains = domain.split("|") if domain else []
                                  if not domains:
                                      errors.append(f"{location}: domain est vide")
                                  invalid_domains = sorted(set(domains) - allowed_domains)
                                  if invalid_domains:
                                      errors.append(
                                          f"{location}: domain non autorisé : {', '.join(invalid_domains)}"
                                      )
                                  verified = row[expected.index("last_verified")]
                                  if verified:
                                      try:
                                          if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", verified):
                                              raise ValueError
                                          date.fromisoformat(verified)
                                      except ValueError:
                                          errors.append(f"{location}: last_verified doit être une date YYYY-MM-DD valide")
                      except (OSError, UnicodeError, csv.Error) as exc:
                          errors.append(f"{path}: CSV illisible : {exc}")

                  if errors:
                      print("\n".join(errors), file=sys.stderr)
                      sys.exit(1)
                  print(f"Validation réussie : {len(paths)} fichier(s) CSV.")
                  print(f"Implantations tech renseignées : {total}.")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write(f"### {total} implantations tech renseignées\n\n{len(paths)} fichiers CSV validés.\n")

                  readme = Path("README.md")
                  content = readme.read_text(encoding="utf-8")
                  badge = (
                      "<!-- company-count:start -->\n"
                      f"[![Implantations tech : {total}](https://img.shields.io/badge/"
                      f"implantations_tech-{total}-059669?style=for-the-badge&logo=databricks&logoColor=white)](data/)\n"
                      "<!-- company-count:end -->"
                  )
                  content, replacements = re.subn(
                      r"<!-- company-count:start -->.*?<!-- company-count:end -->",
                      lambda match: badge,
                      content,
                      flags=re.DOTALL,
                  )
                  if replacements != 1:
                      sys.exit("README.md : bloc company-count absent ou dupliqué")
                  readme.write_text(content, encoding="utf-8")
                  PY
            - name: Update README count
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: |
                  if git diff --quiet -- README.md; then
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git commit -m "docs: Update tech location count"
                  git push origin HEAD:main
